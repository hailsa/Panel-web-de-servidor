<!doctype html>
<html lang="es" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Iniciar sesión · SHC</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img src="/static/img/logo.png" alt="" class="login-logo">
        <div><strong>SHC Monitor</strong><span>Panel del servidor</span></div>
        <small>{{ version }}</small>
      </div>
      <div class="login-heading">
        <span class="login-eyebrow">ACCESO AL PANEL</span>
        <h1 id="login-title">Bienvenido de nuevo</h1>
        <p>Ingresá con tu cuenta para administrar y monitorear el servidor.</p>
      </div>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required autofocus placeholder="Tu usuario">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
        <button type="submit">Ingresar al panel <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <p class="login-footer">SHC Monitor <span aria-hidden="true">·</span> {{ version }}</p>
  </main>
</body>
</html>
