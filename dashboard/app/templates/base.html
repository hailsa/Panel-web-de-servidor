<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}SHC · Monitor de Servidor{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <button id="sidebar-close" class="sidebar-close" aria-label="Cerrar menú">×</button>
    <img class="logo" src="/static/img/logo.png" alt="Logo SHC">
    <nav>
      <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/"><svg><use href="/static/img/icons.svg#dashboard"></use></svg><span>Dashboard</span></a>
      <a class="{{ 'active' if active == 'users' else '' }}" href="/usuarios"><svg><use href="/static/img/icons.svg#users"></use></svg><span>Usuarios</span></a>
      <a class="{{ 'active' if active == 'status' else '' }}" href="/estado-servidor"><svg><use href="/static/img/icons.svg#server"></use></svg><span>Estado del Servidor</span></a>
    </nav>
    <div class="server-id"><small>SERVIDOR</small><strong id="side-host">Conectando…</strong><span>SHC {{ version }}</span></div>
  </aside>
  <button id="sidebar-backdrop" class="sidebar-backdrop" aria-label="Cerrar menú"></button>
  <main>
    <header class="topbar">
      <button id="menu" aria-label="Abrir o contraer menú" aria-expanded="false">☰</button>
      <div class="online"><i></i><span id="server-state">Conectando…</span></div>
      <span id="uptime" class="pill">—</span>
      <div class="topbar-actions">
        <div class="notification-wrap">
          <button id="notifications" class="icon-button" aria-label="Notificaciones" aria-expanded="false">🔔<span id="notification-badge" class="notification-badge hidden">0</span></button>
          <section id="notification-panel" class="notification-panel hidden" aria-label="Centro de notificaciones">
            <header><div><strong>Alertas e incidencias</strong><small id="notification-summary">Sin alertas</small></div><button id="clear-notifications" type="button">Limpiar</button></header>
            <div id="notification-list" class="notification-list"><p class="notification-empty">No hay incidencias activas.</p></div>
          </section>
        </div>
        <button id="power" class="icon-button" aria-label="Opciones de energía" aria-expanded="false">⏻</button>
        <div id="power-menu" class="power-menu hidden">
          <button type="button" data-power="reboot">↻ <span><strong>Reiniciar</strong><small>Reinicia Debian de forma segura</small></span></button>
          <button type="button" data-power="poweroff" class="danger">⏻ <span><strong>Apagar</strong><small>Apaga completamente el servidor</small></span></button>
        </div>
        <button id="terminal-toggle" class="icon-button terminal-toggle" aria-label="Abrir consola" aria-expanded="false">&gt;_</button>
        <button id="theme" class="icon-button" aria-label="Cambiar tema">☾</button>
      </div>
      <time id="clock"></time>
      <form action="/logout" method="post" class="logout-form"><input type="hidden" name="csrf_token" value="{{ logout_csrf_token }}"><button type="submit" aria-label="Cerrar sesión">Salir</button></form>
    </header>
    {% block content %}{% endblock %}
  </main>
  <section id="terminal-panel" class="terminal-panel hidden" aria-label="Consola del servidor">
    <header><strong>Consola · servidor</strong><button id="terminal-close" aria-label="Cerrar consola">×</button></header>
    <div id="terminal-screen"></div>
  </section>
  <dialog id="power-dialog" class="power-dialog">
    <form method="dialog">
      <h2 id="power-dialog-title">Confirmar acción</h2>
      <p id="power-dialog-copy"></p>
      <div><button value="cancel">Cancelar</button><button id="power-confirm" value="confirm" class="danger">Confirmar</button></div>
    </form>
  </dialog>
  <script src="/static/vendor/xterm/xterm.js"></script>
  <script src="/static/js/base.js"></script>
  <script src="/static/js/terminal.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
