<VirtualHost *:80>
    ServerName monitor.example.internal
    Redirect permanent / https://monitor.example.internal/
</VirtualHost>

<VirtualHost *:443>
    ServerName monitor.example.internal

    SSLEngine on
    SSLCertificateFile /etc/shc-monitor/tls/shc-monitor.crt
    SSLCertificateKeyFile /etc/shc-monitor/tls/shc-monitor.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On
    ProxyPass /ws/ ws://127.0.0.1:8085/ws/ connectiontimeout=5 timeout=3600
    ProxyPassReverse /ws/ ws://127.0.0.1:8085/ws/
    ProxyPass / http://127.0.0.1:8085/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:8085/

    <Location />
        # RFC 5737 documentation networks: replace with the authorized private CIDRs.
        Require ip 192.0.2.0/24 198.51.100.0/24
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

    ErrorLog ${APACHE_LOG_DIR}/shc-monitor-error.log
    CustomLog ${APACHE_LOG_DIR}/shc-monitor-access.log combined
</VirtualHost>
